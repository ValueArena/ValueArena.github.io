name: Build evaluation worker

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: evaluation-worker-image
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Free space for GPU dependencies
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          df -h /
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish worker
        id: worker
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile.worker
          platforms: linux/amd64
          push: true
          tags: ghcr.io/valuearena/evaluation-worker:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/ValueArena/ValueArena.github.io
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Record immutable image reference
        env:
          DIGEST: ${{ steps.worker.outputs.digest }}
        run: |
          echo "WORKER_IMAGE=ghcr.io/valuearena/evaluation-worker@$DIGEST" >> "$GITHUB_STEP_SUMMARY"
