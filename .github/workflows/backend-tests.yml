name: Backend tests
on:
  workflow_dispatch:
  pull_request:
    paths: ['backend/**', '.github/workflows/backend-tests.yml']
  push:
    branches: [main]
    paths: ['backend/**', '.github/workflows/backend-tests.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: valuearena_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://postgres:test-only@localhost:5432/valuearena_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: jchang153/EigenBench
          ref: c4ef51394d30ad9824eb76012db24e813f1a76c1
          path: upstream-eigenbench
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r backend/requirements-dev.txt
      - run: python -m pytest -q
        working-directory: backend
        env:
          EIGENBENCH_SOURCE: ${{ github.workspace }}/upstream-eigenbench
