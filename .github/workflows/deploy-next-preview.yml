name: Build Next.js site (root deploy)

# Source lives in next-src/. The built static export is committed to the
# repo root so the existing "Deploy from branch: main /" Pages config
# publishes it at https://valuearena.github.io/.

on:
  push:
    branches: [main]
    paths:
      - 'next-src/**'
      - '.github/workflows/deploy-next-preview.yml'
  workflow_dispatch:

concurrency:
  group: next-build
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    # Skip the bot's own follow-up commit.
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install deps
        working-directory: next-src
        run: bun install --frozen-lockfile

      - name: Build (root deploy)
        working-directory: next-src
        env:
          NODE_ENV: production
          BASE_PATH: ""
        run: bun run build

      - name: Sync build output to repo root
        run: |
          # Paths we MUST keep untouched in the working tree.
          # Everything else at the root that isn't a directory we recognize
          # as "ours" is removed before copying so deletions in source
          # propagate cleanly.
          KEEP=( ".git" ".github" "next-src" "valuearena" "costa-nus.github.io" "assets" )

          # Delete legacy publish artefacts and stale Next output. Each path
          # listed explicitly so we never `rm -rf .` by accident.
          rm -rf _next next out
          rm -f index.html model.html constitution.html run.html methodology.html sitemap.xml robots.txt favicon.svg
          rm -rf js css img

          # Copy the new export over.
          cp -R next-src/out/. ./
          touch .nojekyll
          ls -la | head -30

      - name: Commit & push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "ci: rebuild site from ${GITHUB_SHA::7} [skip ci]"
          git push
